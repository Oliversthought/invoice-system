<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企业级发票与收据管理系统 (云端同步版)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- html2pdf.js for Client-Side PDF Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- === 引入 Firebase SDK 模組 === -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.FirebaseModule = { initializeApp, getAuth, signInAnonymously, getFirestore, doc, setDoc, onSnapshot };
        window.dispatchEvent(new Event('firebase-loaded'));
    </script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff', 100: '#dbeafe', 500: '#2563eb',
                            600: '#1d4ed8', 700: '#1e40af', 800: '#1e3a8a',
                        }
                    },
                    fontFamily: { sans: ['Inter', 'Noto Sans SC', 'sans-serif'], }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', 'Noto Sans SC', sans-serif; background-color: #f8fafc; }

        /* Standard A4 Paper Ratio Container */
        .a4-preview {
            width: 100%; max-width: 794px; min-height: 1080px; background: white;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
            margin: 0 auto; position: relative;
        }

        /* Print Media Styles Optimization */
        @media print {
            body { background: white !important; color: black !important; }
            .no-print { display: none !important; }
            .a4-preview { box-shadow: none !important; width: 100% !important; max-width: 100% !important; min-height: auto !important; padding: 0 !important; margin: 0 !important; }
            @page { size: A4; margin: 10mm; }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="h-screen overflow-hidden flex flex-col text-slate-800">

    <!-- Top Global Header -->
    <header class="bg-white border-b border-slate-200 h-14 flex items-center justify-between px-4 z-20 no-print shrink-0">
        <div class="flex items-center space-x-3">
            <div class="bg-blue-600 text-white p-1.5 rounded-lg shadow">
                <i class="fa-solid fa-file-invoice-dollar text-lg"></i>
            </div>
            <div>
                <h1 class="font-bold text-sm sm:text-base text-slate-800 leading-none">企业项目发票与收据管理系统</h1>
                <p class="text-[10px] text-slate-400 mt-0.5 flex items-center gap-1">
                    <span id="cloud-status-indicator" class="w-1.5 h-1.5 rounded-full bg-slate-300"></span>
                    <span id="cloud-status-text">单机离线模式</span>
                </p>
            </div>
        </div>

        <div id="header-user-status" class="flex items-center space-x-3 hidden">
            <div class="hidden sm:flex items-center gap-2 px-2.5 py-1 bg-slate-100 rounded-full text-xs text-slate-600">
                <i class="fa-solid fa-circle-user text-blue-600"></i>
                <span id="user-display-name">管理员</span>
            </div>
            <button onclick="handleLogout()" class="text-xs text-slate-500 hover:text-red-600 px-2.5 py-1 rounded border border-slate-200 hover:border-red-200 transition flex items-center gap-1">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
                <span class="hidden sm:inline">退出登录</span>
            </button>
        </div>
    </header>

    <!-- MAIN WORKSPACE -->
    <div id="app-container" class="flex-1 flex overflow-hidden hidden">
        
        <!-- LEFT SIDEBAR -->
        <aside class="w-72 sm:w-80 bg-slate-900 text-slate-300 flex flex-col border-r border-slate-800 shrink-0 no-print relative">
            <div class="p-3 border-b border-slate-800/80 space-y-2">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-xs text-slate-500"></i>
                    <input type="text" id="project-search-input" oninput="renderProjectsSidebar()" placeholder="搜索项目或客户名称..." class="w-full bg-slate-800 text-xs text-slate-200 pl-8 pr-3 py-1.5 rounded-lg border border-slate-700/60 focus:outline-none focus:border-blue-500">
                </div>
            </div>
            <div id="projects-sidebar-list" class="flex-1 overflow-y-auto p-2 space-y-1.5"></div>
            <div class="p-3 border-t border-slate-800/80 bg-slate-900/95 sticky bottom-0">
                <button onclick="addNewProject()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium text-xs py-2.5 px-3 rounded-lg shadow transition flex items-center justify-center gap-2 group">
                    <i class="fa-solid fa-circle-plus text-sm group-hover:scale-110 transition-transform"></i>
                    <span>新增项目档案</span>
                </button>
            </div>
        </aside>

        <!-- RIGHT MAIN AREA -->
        <main class="flex-1 flex flex-col bg-slate-100 overflow-hidden relative">
            <div id="empty-state-view" class="flex-1 flex flex-col items-center justify-center p-8 text-center hidden">
                <div class="w-20 h-20 bg-blue-50 rounded-full flex items-center justify-center text-blue-500 mb-4 text-3xl"><i class="fa-solid fa-folder-plus"></i></div>
                <h3 class="font-bold text-slate-700 text-lg mb-1">暂无项目档案</h3>
                <button onclick="addNewProject()" class="px-4 py-2 bg-blue-600 text-white text-xs font-medium rounded-lg shadow hover:bg-blue-700 transition">新建项目档案</button>
            </div>

            <div id="project-workspace-view" class="flex-1 flex flex-col overflow-hidden">
                <div class="bg-white border-b border-slate-200 px-4 pt-3 flex flex-wrap items-center justify-between gap-3 no-print shrink-0">
                    <div class="flex items-center space-x-1 sm:space-x-2 border-b border-slate-200">
                        <button id="tab-doc-quotation" onclick="switchDocType('QUOTATION')" class="px-3 py-2 text-xs font-semibold border-b-2 border-blue-600 text-blue-600 flex items-center gap-1.5 transition"><i class="fa-solid fa-clipboard-list"></i> 📋 报价单</button>
                        <button id="tab-doc-invoice" onclick="switchDocType('INVOICE')" class="px-3 py-2 text-xs font-semibold border-b-2 border-transparent text-slate-500 flex items-center gap-1.5 transition"><i class="fa-solid fa-file-invoice"></i> 🧾 发票</button>
                        <button id="tab-doc-receipt" onclick="switchDocType('RECEIPT')" class="px-3 py-2 text-xs font-semibold border-b-2 border-transparent text-slate-500 flex items-center gap-1.5 transition"><i class="fa-solid fa-receipt"></i> 💳 收据</button>
                        <button id="tab-doc-settings" onclick="switchDocType('SETTINGS')" class="px-3 py-2 text-xs font-semibold border-b-2 border-transparent text-slate-500 flex items-center gap-1.5 transition"><i class="fa-solid fa-building"></i> ⚙️ 公司资料设置</button>
                    </div>
                    <div id="document-action-buttons" class="flex items-center space-x-2 pb-2">
                        <button onclick="saveCurrentData()" class="px-3 py-1.5 bg-emerald-50 text-emerald-600 hover:bg-emerald-100 font-medium text-xs rounded-lg transition"><i class="fa-solid fa-floppy-disk"></i> 保存</button>
                        <button onclick="window.print()" class="px-3 py-1.5 bg-slate-800 text-white font-medium text-xs rounded-lg shadow-sm"><i class="fa-solid fa-print"></i> 打印</button>
                        <button onclick="exportToPDF()" class="px-3 py-1.5 bg-blue-600 text-white font-medium text-xs rounded-lg shadow"><i class="fa-solid fa-file-pdf"></i> 导出 PDF</button>
                        <button onclick="deleteActiveProject()" class="p-1.5 text-slate-400 hover:text-red-600"><i class="fa-solid fa-trash-can text-sm"></i></button>
                    </div>
                </div>

                <div class="flex-1 overflow-hidden grid grid-cols-1 lg:grid-cols-12 gap-0">
                    <!-- LEFT COLUMN -->
                    <div id="left-editor-panel" class="lg:col-span-5 border-r border-slate-200 bg-white p-4 sm:p-5 overflow-y-auto space-y-5 no-print">
                        <!-- Settings Block -->
                        <div id="settings-form-block" class="space-y-4 hidden">
                            <div class="border-b pb-3"><h3 class="font-bold text-slate-800 text-sm">公司基本资料设置</h3></div>
                            <div class="space-y-3 text-xs">
                                <div><label class="block font-medium text-slate-600 mb-1">公司名称</label><input type="text" id="cfg-company-name" oninput="updateCompanyProfileFromForm()" class="w-full border border-slate-200 rounded-lg p-2"></div>
                                <div class="grid grid-cols-2 gap-2">
                                    <div><label class="block font-medium text-slate-600 mb-1">税号</label><input type="text" id="cfg-tax-id" oninput="updateCompanyProfileFromForm()" class="w-full border border-slate-200 rounded-lg p-2"></div>
                                    <div><label class="block font-medium text-slate-600 mb-1">联系电话</label><input type="text" id="cfg-phone" oninput="updateCompanyProfileFromForm()" class="w-full border border-slate-200 rounded-lg p-2"></div>
                                </div>
                                <div><label class="block font-medium text-slate-600 mb-1">公司地址</label><input type="text" id="cfg-address" oninput="updateCompanyProfileFromForm()" class="w-full border border-slate-200 rounded-lg p-2"></div>
                                <div><label class="block font-medium text-slate-600 mb-1">开户银行</label><input type="text" id="cfg-bank-name" oninput="updateCompanyProfileFromForm()" class="w-full border border-slate-200 rounded-lg p-2"></div>
                                <div><label class="block font-medium text-slate-600 mb-1">银行账号</label><input type="text" id="cfg-bank-account" oninput="updateCompanyProfileFromForm()" class="w-full border border-slate-200 rounded-lg p-2"></div>
                                <div class="pt-3 border-t border-slate-100 space-y-3">
                                    <div><label class="block font-medium text-slate-600 mb-1">上传 Logo</label><input type="file" accept="image/*" onchange="uploadLogoFile(event)" class="text-xs"></div>
                                    <div><label class="block font-medium text-slate-600 mb-1">上传印章</label><input type="file" accept="image/*" onchange="uploadStampFile(event)" class="text-xs"></div>
                                </div>
                            </div>
                        </div>

                        <!-- Project Block -->
                        <div id="project-form-block" class="space-y-4">
                            <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-200/80 space-y-3">
                                <h4 class="font-bold text-slate-700 text-xs flex justify-between border-b pb-2">
                                    <span>项目与客户基本资料</span>
                                    <select id="project-status-select" onchange="updateActiveProjectFromInputs()" class="text-xs border rounded"><option value="进行中">进行中</option><option value="已完成">已完成</option><option value="草稿">草稿</option></select>
                                </h4>
                                <div class="space-y-2 text-xs">
                                    <div><label class="block text-slate-500 mb-0.5">项目名称</label><input type="text" id="input-project-name" oninput="updateActiveProjectFromInputs()" class="w-full border rounded p-2 text-slate-800 font-bold"></div>
                                    <div class="grid grid-cols-2 gap-2">
                                        <div><label class="block text-slate-500 mb-0.5">客户名称</label><input type="text" id="input-client-name" oninput="updateActiveProjectFromInputs()" class="w-full border rounded p-1.5"></div>
                                        <div><label class="block text-slate-500 mb-0.5">客户税号</label><input type="text" id="input-client-tax" oninput="updateActiveProjectFromInputs()" class="w-full border rounded p-1.5"></div>
                                    </div>
                                    <div><label class="block text-slate-500 mb-0.5">客户地址/电话</label><input type="text" id="input-client-address" oninput="updateActiveProjectFromInputs()" class="w-full border rounded p-1.5"></div>
                                </div>
                            </div>
                            
                            <div class="p-3.5 rounded-xl border border-slate-200 space-y-3">
                                <div class="grid grid-cols-3 gap-2 text-xs">
                                    <div><label class="block text-slate-500 mb-0.5">货币单位</label><select id="input-currency" onchange="updateActiveProjectFromInputs()" class="w-full border rounded p-1.5"><option value="CNY">CNY</option><option value="MOP">MOP</option><option value="HKD">HKD</option></select></div>
                                    <div><label class="block text-slate-500 mb-0.5">开单日期</label><input type="date" id="input-doc-date" onchange="updateActiveProjectFromInputs()" class="w-full border rounded p-1.5"></div>
                                    <div><label class="block text-slate-500 mb-0.5">有效期</label><input type="date" id="input-doc-duedate" onchange="updateActiveProjectFromInputs()" class="w-full border rounded p-1.5"></div>
                                </div>
                                <div id="receipt-payment-field" class="grid grid-cols-2 gap-2 text-xs pt-1 hidden">
                                    <div><label class="block text-slate-500 mb-0.5">收款状态</label><select id="input-payment-status" onchange="updateActiveProjectFromInputs()" class="w-full border rounded p-1.5"><option>已全额付款</option><option>未付款</option></select></div>
                                    <div><label class="block text-slate-500 mb-0.5">支付方式</label><input type="text" id="input-payment-method" oninput="updateActiveProjectFromInputs()" class="w-full border rounded p-1.5"></div>
                                </div>
                            </div>

                            <div class="p-3.5 rounded-xl border border-slate-200 space-y-3">
                                <div class="flex justify-between border-b pb-2"><h4 class="font-bold text-slate-700 text-xs">费用明细</h4><button onclick="addProjectItemRow()" class="text-blue-600 text-xs">+ 添加</button></div>
                                <div id="items-inputs-container" class="space-y-2"></div>
                                <div class="grid grid-cols-2 gap-2 text-xs border-t pt-2">
                                    <div><label class="block text-slate-500 mb-0.5">税率 (%)</label><input type="number" id="input-tax-rate" oninput="updateActiveProjectFromInputs()" class="w-full border rounded p-1.5"></div>
                                    <div><label class="block text-slate-500 mb-0.5">折扣减免</label><input type="number" id="input-discount-flat" oninput="updateActiveProjectFromInputs()" class="w-full border rounded p-1.5"></div>
                                </div>
                            </div>

                            <div class="p-3.5 rounded-xl border border-slate-200 text-xs">
                                <label class="block text-slate-500 mb-1">备注条款</label>
                                <textarea id="input-doc-notes" rows="2" oninput="updateActiveProjectFromInputs()" class="w-full border rounded p-2"></textarea>
                                <label class="flex items-center gap-2 mt-2 cursor-pointer text-slate-600"><input type="checkbox" id="input-show-seal" onchange="updateActiveProjectFromInputs()" checked><span>显示电子印章</span></label>
                            </div>
                        </div>
                    </div>

                    <!-- RIGHT COLUMN: Preview -->
                    <div id="right-preview-panel" class="lg:col-span-7 bg-slate-200/80 p-4 sm:p-8 overflow-y-auto flex flex-col items-center">
                        <div id="printable-document-card" class="a4-preview p-8 sm:p-12 text-slate-800 flex flex-col">
                            <div class="flex justify-between items-start border-b-2 pb-6 border-slate-200">
                                <div class="space-y-2.5 max-w-[58%]">
                                    <div class="h-12 flex items-center"><img id="pv-logo-img" class="max-h-12 max-w-[180px] object-contain hidden" src=""></div>
                                    <div>
                                        <h2 id="pv-seller-name" class="font-bold text-lg leading-tight"></h2>
                                        <p id="pv-seller-tax" class="text-xs text-slate-500 mt-1"></p>
                                        <p id="pv-seller-address" class="text-xs text-slate-500"></p>
                                        <p id="pv-seller-phone" class="text-xs text-slate-500"></p>
                                    </div>
                                </div>
                                <div class="text-right space-y-2">
                                    <span id="pv-doc-badge" class="inline-block text-xl font-black uppercase px-3 py-1 rounded bg-blue-100 text-blue-700"></span>
                                    <div class="text-xs space-y-1 text-slate-600 font-mono">
                                        <p><span class="text-slate-400">编号:</span> <span id="pv-doc-code" class="font-bold"></span></p>
                                        <p><span class="text-slate-400">日期:</span> <span id="pv-doc-date"></span></p>
                                        <p><span id="pv-duedate-label" class="text-slate-400">有效期:</span> <span id="pv-doc-duedate"></span></p>
                                    </div>
                                    <div id="pv-receipt-status-badge" class="inline-block mt-2 border border-emerald-500 text-emerald-600 font-bold text-[11px] px-2 py-0.5 rounded hidden"></div>
                                </div>
                            </div>

                            <div class="my-6 p-4 rounded-lg bg-slate-50 border border-slate-100 grid grid-cols-2 gap-4 text-xs">
                                <div>
                                    <p class="font-semibold text-slate-400 text-[10px] mb-1">客户抬头:</p>
                                    <h3 id="pv-client-name" class="font-bold text-slate-800 text-sm"></h3>
                                    <p id="pv-client-tax" class="text-slate-500 mt-0.5"></p>
                                </div>
                                <div class="text-right flex flex-col justify-between">
                                    <div><p class="font-semibold text-slate-400 text-[10px] mb-1">项目:</p><p id="pv-project-title" class="font-medium"></p></div>
                                    <p id="pv-client-address" class="text-slate-500"></p>
                                </div>
                            </div>

                            <div class="mt-6 flex-1">
                                <table class="w-full text-left text-xs">
                                    <thead><tr class="border-b-2 border-slate-200 text-slate-500 font-semibold"><th class="py-2.5 px-2">#</th><th class="py-2.5 px-2">项目内容</th><th class="py-2.5 px-2 text-right">数量</th><th class="py-2.5 px-2 text-right">单价</th><th class="py-2.5 px-2 text-right">金额</th></tr></thead>
                                    <tbody id="pv-items-tbody" class="divide-y divide-slate-100 text-slate-700"></tbody>
                                </table>
                            </div>

                            <div class="mt-6 pt-4 border-t border-slate-200 flex justify-end">
                                <div class="w-60 space-y-1.5 text-xs">
                                    <div class="flex justify-between text-slate-600"><span>小计:</span><span id="pv-math-subtotal" class="font-mono"></span></div>
                                    <div class="flex justify-between text-slate-600"><span>折扣:</span><span id="pv-math-discount" class="font-mono text-red-500"></span></div>
                                    <div class="flex justify-between text-slate-600"><span>税 (<span id="pv-math-taxrate"></span>%):</span><span id="pv-math-tax" class="font-mono"></span></div>
                                    <div class="flex justify-between text-sm font-bold border-t pt-2"><span>总计:</span><span id="pv-math-grandtotal" class="font-mono text-base text-blue-600"></span></div>
                                </div>
                            </div>

                            <div class="mt-8 grid grid-cols-2 gap-6 pt-6 border-t border-slate-100 text-xs text-slate-600">
                                <div class="space-y-1"><p class="font-bold text-slate-800">收款账户</p><p>户名: <span id="pv-bank-name"></span></p><p>账号: <span id="pv-bank-account" class="font-mono"></span></p></div>
                                <div class="space-y-1"><p class="font-bold text-slate-800">条款说明</p><p id="pv-doc-notes" class="whitespace-pre-line text-slate-500"></p></div>
                            </div>

                            <div class="mt-12 pt-4 border-t border-slate-100 flex justify-between items-end relative">
                                <div class="text-[10px] text-slate-400"><p>感谢您的支持与合作！</p></div>
                                <div class="text-center relative min-w-[150px]">
                                    <p class="text-xs text-slate-500 mb-6">开票单位/盖章</p><div class="border-b border-slate-300 w-full"></div>
                                    <img id="pv-stamp-img" class="absolute -top-6 right-2 w-28 h-28 object-contain pointer-events-none opacity-90 hidden">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- AUTH MODAL -->
    <div id="auth-modal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-5">
            <div class="text-center"><h2 class="text-xl font-bold">系统登录</h2><p class="text-xs text-slate-400">测试账号: admin | 密码: 123456</p></div>
            <form id="auth-form" onsubmit="handleLocalAuthSubmit(event)" class="space-y-3">
                <input type="text" id="auth-username" required placeholder="用户名" class="w-full text-xs border p-2.5 rounded-lg" value="admin">
                <input type="password" id="auth-password" required placeholder="密码" class="w-full text-xs border p-2.5 rounded-lg" value="123456">
                <button type="submit" class="w-full py-2.5 bg-blue-600 text-white font-medium rounded-lg">登 录</button>
            </form>
        </div>
    </div>

    <!-- Toast Component -->
    <div id="toast-box" class="fixed bottom-5 right-5 z-50 transition-all transform translate-y-10 opacity-0 pointer-events-none">
        <div id="toast-content" class="px-4 py-2.5 rounded-lg shadow-xl text-xs text-white bg-slate-800"><span id="toast-text"></span></div>
    </div>

    <script>
        // ==========================================
        // 🚀 FIREBASE 云端同步配置区 (请在此处贴上金钥)
        // ==========================================
        const firebaseConfig = {
  apiKey: "AIzaSyAQd6Mz7_wMyOqgCRva0jcqlWHwljy4nSY",
  authDomain: "nestprosystem.firebaseapp.com",
  projectId: "nestprosystem",
  storageBucket: "nestprosystem.firebasestorage.app",
  messagingSenderId: "173379181940",
  appId: "1:173379181940:web:3cb0240903eefc6acfe021",
  measurementId: "G-9S53ZR1TBH"
};

        // --- 云端同步引擎逻辑 ---
        let useCloud = false;
        let db, auth, cloudUserId;
        let cloudDebounceTimer;

        window.addEventListener('firebase-loaded', async () => {
            if (firebaseConfig.apiKey === "YOUR_API_KEY") {
                console.log("⚠️ 尚未设定 Firebase 金钥，保持单机离线模式。");
                return;
            }
            try {
                const { initializeApp, getAuth, signInAnonymously, getFirestore } = window.FirebaseModule;
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                await signInAnonymously(auth);
                if (!auth.currentUser) return;
                cloudUserId = auth.currentUser.uid;
                useCloud = true;
                
                document.getElementById('cloud-status-indicator').classList.replace('bg-slate-300', 'bg-emerald-400');
                document.getElementById('cloud-status-text').textContent = '云端已连线';
                console.log("☁️ 成功连接 Firebase 云端数据库！");
                
                startCloudSync();
            } catch(err) {
                console.error("Firebase 连线失败:", err);
            }
        });

        function startCloudSync() {
            const { onSnapshot, doc } = window.FirebaseModule;
            const userRef = doc(db, 'invoice_app_users', cloudUserId);

            onSnapshot(userRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    // 仅当是其他设备修改时才强制覆写本地画面
                    if (!docSnap.metadata.hasPendingWrites) {
                        if (data.projects) projectsList = data.projects;
                        if (data.settings) companySettings = data.settings;
                        
                        localStorage.setItem('sys_projects_list', JSON.stringify(projectsList));
                        localStorage.setItem('sys_company_settings', JSON.stringify(companySettings));
                        
                        syncCompanySettingsUI();
                        renderProjectsSidebar();
                        if (activeProjectId) {
                            activeProject = projectsList.find(p => p.id === activeProjectId);
                            renderActiveProjectToForm();
                        }
                    }
                } else {
                    // 云端没资料但本机有，自动将本机资料上传
                    syncToCloud();
                }
            });
        }

        function syncToCloud() {
            if (!useCloud || !cloudUserId) return;
            clearTimeout(cloudDebounceTimer);
            cloudDebounceTimer = setTimeout(async () => {
                try {
                    const { setDoc, doc } = window.FirebaseModule;
                    await setDoc(doc(db, 'invoice_app_users', cloudUserId), {
                        projects: projectsList,
                        settings: companySettings,
                        updatedAt: Date.now()
                    });
                } catch (err) {
                    console.error("云端上传失败:", err);
                }
            }, 800); // 延时 0.8秒上传，防止打字太快耗损资料库额度
        }
        // ==========================================

        const CURRENCY_SYMBOLS = { CNY: '¥', MOP: 'MOP$', HKD: 'HK$' };
        let currentUser = null; let activeProjectId = null; let activeProject = null;
        let currentDocType = 'QUOTATION';
        let companySettings = {}; let projectsList = [];

        window.onload = function() {
            initLocalStorageData();
            if (localStorage.getItem('sys_current_session')) {
                currentUser = localStorage.getItem('sys_current_session');
                loginSuccess();
            }
        };

        function initLocalStorageData() {
            const savedSettings = localStorage.getItem('sys_company_settings');
            if (savedSettings) companySettings = JSON.parse(savedSettings);
            const savedProjects = localStorage.getItem('sys_projects_list');
            if (savedProjects) projectsList = JSON.parse(savedProjects);
        }

        function handleLocalAuthSubmit(e) {
            e.preventDefault();
            const u = document.getElementById('auth-username').value;
            localStorage.setItem('sys_current_session', u);
            currentUser = u;
            loginSuccess();
            showToast("登录成功！", "success");
        }

        function loginSuccess() {
            document.getElementById('auth-modal').classList.add('hidden');
            document.getElementById('app-container').classList.remove('hidden');
            document.getElementById('header-user-status').classList.remove('hidden');
            document.getElementById('user-display-name').textContent = currentUser;
            syncCompanySettingsUI();
            renderProjectsSidebar();
            if (projectsList.length > 0) selectProject(projectsList[0].id);
            else document.getElementById('empty-state-view').classList.remove('hidden');
        }

        function handleLogout() {
            localStorage.removeItem('sys_current_session');
            location.reload();
        }

        function renderProjectsSidebar() {
            const container = document.getElementById('projects-sidebar-list');
            const search = document.getElementById('project-search-input').value.toLowerCase();
            container.innerHTML = '';
            projectsList.forEach(p => {
                if (search && !(p.projectName||'').toLowerCase().includes(search) && !(p.clientName||'').toLowerCase().includes(search)) return;
                const d = document.createElement('div');
                d.onclick = () => selectProject(p.id);
                d.className = `p-3 rounded-lg cursor-pointer border ${p.id === activeProjectId ? 'bg-blue-600/10 border-blue-500 text-white' : 'border-slate-800 text-slate-300'}`;
                d.innerHTML = `<div class="font-bold text-xs truncate">${p.projectName || '未命名项目'}</div><div class="text-[10px] text-slate-400 mt-1">${p.clientName || '-'}</div>`;
                container.appendChild(d);
            });
        }

        function selectProject(id) {
            activeProjectId = id;
            activeProject = projectsList.find(p => p.id === id);
            document.getElementById('empty-state-view').classList.add('hidden');
            document.getElementById('project-workspace-view').classList.remove('hidden');
            renderProjectsSidebar();
            renderActiveProjectToForm();
        }

        function addNewProject() {
            const p = {
                id: 'proj_' + Date.now(), projectName: '新项目', clientName: '新客户', currency: 'CNY',
                docDate: new Date().toISOString().split('T')[0], items: [{ description: '服务项目', quantity: 1, price: 1000 }], taxRate: 6
            };
            projectsList.unshift(p);
            saveProjectsToStorage();
            selectProject(p.id);
        }

        function renderActiveProjectToForm() {
            const p = activeProject;
            document.getElementById('input-project-name').value = p.projectName || '';
            document.getElementById('input-client-name').value = p.clientName || '';
            document.getElementById('input-currency').value = p.currency || 'CNY';
            document.getElementById('input-doc-date').value = p.docDate || '';
            
            const c = document.getElementById('items-inputs-container');
            c.innerHTML = '';
            (p.items || []).forEach((item, idx) => {
                const r = document.createElement('div'); r.className = 'flex gap-1.5';
                r.innerHTML = `<input type="text" value="${item.description}" oninput="uItem(${idx}, 'description', this.value)" class="flex-1 border p-1.5 text-xs"><input type="number" value="${item.quantity}" oninput="uItem(${idx}, 'quantity', this.value)" class="w-14 border p-1.5 text-xs"><input type="number" value="${item.price}" oninput="uItem(${idx}, 'price', this.value)" class="w-20 border p-1.5 text-xs"><button onclick="rmItem(${idx})">🗑️</button>`;
                c.appendChild(r);
            });
            renderPreview();
        }

        function uItem(idx, f, v) { activeProject.items[idx][f] = f==='description'?v:Number(v); updateActiveProjectFromInputs(); }
        function addProjectItemRow() { activeProject.items.push({description:'', quantity:1, price:0}); renderActiveProjectToForm(); updateActiveProjectFromInputs(); }
        function rmItem(idx) { activeProject.items.splice(idx, 1); renderActiveProjectToForm(); updateActiveProjectFromInputs(); }

        function updateActiveProjectFromInputs() {
            activeProject.projectName = document.getElementById('input-project-name').value;
            activeProject.clientName = document.getElementById('input-client-name').value;
            activeProject.currency = document.getElementById('input-currency').value;
            activeProject.docDate = document.getElementById('input-doc-date').value;
            saveProjectsToStorage();
            renderPreview();
        }

        function saveProjectsToStorage() {
            localStorage.setItem('sys_projects_list', JSON.stringify(projectsList));
            syncToCloud(); // 觸發雲端上傳
        }
        function saveSettingsToStorage() {
            localStorage.setItem('sys_company_settings', JSON.stringify(companySettings));
            syncToCloud(); // 觸發雲端上傳
        }
        function saveCurrentData() { showToast("已保存！", "success"); }

        function switchDocType(type) {
            currentDocType = type;
            renderPreview();
            ['QUOTATION','INVOICE','RECEIPT','SETTINGS'].forEach(k => {
                document.getElementById(`tab-doc-${k.toLowerCase()}`).className = type===k ? "px-3 py-2 text-xs font-semibold border-b-2 border-blue-600 text-blue-600" : "px-3 py-2 text-xs text-slate-500";
            });
            if(type==='SETTINGS') { document.getElementById('project-form-block').classList.add('hidden'); document.getElementById('settings-form-block').classList.remove('hidden'); }
            else { document.getElementById('project-form-block').classList.remove('hidden'); document.getElementById('settings-form-block').classList.add('hidden'); }
        }

        function renderPreview() {
            const p = activeProject || {}; const cfg = companySettings || {};
            const sym = CURRENCY_SYMBOLS[p.currency] || '¥';
            
            document.getElementById('pv-seller-name').textContent = cfg.companyName || '';
            document.getElementById('pv-doc-badge').textContent = currentDocType==='QUOTATION'?'报价单':currentDocType==='INVOICE'?'发票':'收据';
            document.getElementById('pv-client-name').textContent = p.clientName || '';
            document.getElementById('pv-project-title').textContent = p.projectName || '';
            
            let t = 0; const tbody = document.getElementById('pv-items-tbody'); tbody.innerHTML = '';
            (p.items || []).forEach((item, i) => {
                t += item.quantity * item.price;
                const tr = document.createElement('tr');
                tr.innerHTML = `<td class="py-2 px-2">${i+1}</td><td class="py-2 px-2">${item.description}</td><td class="py-2 px-2 text-right">${item.quantity}</td><td class="py-2 px-2 text-right">${sym}${item.price}</td><td class="py-2 px-2 text-right">${sym}${item.quantity*item.price}</td>`;
                tbody.appendChild(tr);
            });
            document.getElementById('pv-math-grandtotal').textContent = `${sym}${t}`;
        }

        function syncCompanySettingsUI() { document.getElementById('cfg-company-name').value = companySettings.companyName || ''; }
        function updateCompanyProfileFromForm() { companySettings.companyName = document.getElementById('cfg-company-name').value; saveSettingsToStorage(); renderPreview(); }

        function showToast(msg) {
            const t = document.getElementById('toast-box'); document.getElementById('toast-text').textContent = msg;
            t.classList.remove('translate-y-10', 'opacity-0');
            setTimeout(() => t.classList.add('translate-y-10', 'opacity-0'), 2000);
        }
        
        function exportToPDF() {
            html2pdf().set({margin: 8, filename: `Document.pdf`, jsPDF: {unit: 'mm', format: 'a4'}}).from(document.getElementById('printable-document-card')).save();
        }
    </script>
</body>
</html>
